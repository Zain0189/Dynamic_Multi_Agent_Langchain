<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Multi-Service Agent</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ===== TOP NAVBAR ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" id="mobileMenuBtn" title="Toggle Sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-brand">
        <div class="brand-icon"><i class="fa-solid fa-robot"></i></div>
        <span class="brand-title">Dynamic Multi-Service Agent</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-primary" id="btnNewChat">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>New Chat</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-layout">

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-collapse-btn" id="sidebarToggle" title="Collapse">
        <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
      </button>

      <!-- ── SEARCH PANEL ── -->
      <div class="tab-panel active" id="tab-search">

        <!-- Search by Keyword -->
        <div class="sidebar-section">
          <label class="section-label">
            <i class="fa-solid fa-key"></i> Search by Keywords
          </label>
          <div class="input-action-row">
            <input type="text" id="searchKeyword" placeholder="Enter keyword…" class="sidebar-input" />
            <button class="btn-search" id="btnKeywordSearch" title="Search">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

        <!-- Search by Employee ID -->
        <div class="sidebar-section">
          <label class="section-label">
            <i class="fa-solid fa-id-badge"></i> Search by Employee ID
          </label>
          <div class="input-action-row">
            <input type="text" id="searchEmpId" placeholder="e.g. EMP001" class="sidebar-input" />
            <button class="btn-search" id="btnEmpSearch" title="Lookup">
              <i class="fa-solid fa-user-magnifying-glass"></i>
            </button>
          </div>
          <p class="field-hint">Try: EMP001 – EMP020</p>
        </div>

        <!-- Projects -->
        <div class="sidebar-section">
          <label class="section-label">
            <i class="fa-solid fa-layer-group"></i> PROJECT
            <span class="label-hint">Select environments</span>
          </label>
          <div id="projectListContainer" class="projects-grid"></div>
        </div>

      </div>

    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">

      <!-- Hero -->
      <section class="hero-section" id="heroSection">
        <div class="hero-icon"><i class="fa-solid fa-comments"></i></div>
        <h1 class="hero-title">How can I help you today?</h1>
        <p class="hero-subtitle">Ask about employee profiles, project metrics, HR policies, or healthcare insurance.</p>
      </section>

      <!-- Results Panel (hidden initially) -->
      <section class="results-panel" id="resultsPanel" style="display:none">
        <div class="results-header">
          <h2 class="results-title" id="resultsPanelTitle">Results</h2>
          <button class="btn-close-results" id="btnCloseResults">
            <i class="fa-solid fa-xmark"></i> Close
          </button>
        </div>
        <div class="results-content" id="resultsPanelContent"></div>
      </section>

      <!-- Feature Cards -->

        <div class="feature-card card-blue" data-action="attendance" tabindex="0">

      <!-- ── CHAT AREA ── -->
      <div class="chat-container" id="chatContainer">
        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Input Bar -->
        <div class="chat-input-bar">
          <button class="chat-attach" id="chatAttachBtn" title="Upload document">
            <i class="fa-solid fa-paperclip"></i>
          </button>
          <!-- <div class="chat-quick-btns">
            <button class="chat-quick-check" onclick="quickAction('attendance')" title="Attendance Report">
              <i class="fa-solid fa-calendar-check"></i><span> Attendance</span>
            </button>
            <button class="chat-quick-check" onclick="quickAction('jobs')" title="Jobs & Hiring">
              <i class="fa-solid fa-briefcase"></i><span> Jobs</span>
            </button>

              <i class="fa-solid fa-file-medical"></i><span> Claims</span>

            <button class="chat-quick-check" onclick="quickAction('projects')" title="Projects List">
              <i class="fa-solid fa-diagram-project"></i><span> Projects</span>

              <i class="fa-solid fa-book-open"></i><span> Policy</span>
            </button>
          </div> -->
          <div class="chat-input-wrap">
            <textarea class="chat-textarea" placeholder="Ask anything — employee info, attendance, jobs, claims, HR policy…" rows="1" id="chatInput"></textarea>
          </div>
          <button class="chat-send" id="chatSend" title="Send">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
        <p class="chat-footer-note">
          Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line
        </p>
      </div>

    </main>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
